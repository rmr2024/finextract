[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finextract"
version = "0.1.0"
description = "Benchmark and reduce LLM hallucination when extracting figures from SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
finextract = "finextract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finextract = ["sample/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
